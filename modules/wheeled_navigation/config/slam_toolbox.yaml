slam_toolbox:
  ros__parameters:
    use_sim_time: true
    solver_plugin: solver_plugins::CeresSolver
    mode: mapping
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint
    scan_topic: /scan
    resolution: 0.025
    min_laser_range: 0.15
    max_laser_range: 8.0
    minimum_time_interval: 0.0
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.1
    transform_publish_period: 0.02
    map_update_interval: 1.0
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    use_scan_matching: true
    do_loop_closing: true
    throttle_scans: 1
    enable_interactive_mode: false
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 12.0
    # Lower the evidence threshold for deterministic simulator ranges so the
    # fine grid becomes usable before the first translation. Not for hardware.
    min_pass_through: 1
    occupancy_threshold: 0.1
